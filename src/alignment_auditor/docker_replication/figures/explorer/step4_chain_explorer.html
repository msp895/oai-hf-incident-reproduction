// ---------- highlighters (tiny, purpose-built; no library needed) ----------
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const urlify = s => s.replace(/(https?:\/\/[^\s"'<>)]+)/g, '<span class="u">$1</span>');
const hl = {
  csv(t){
    return t.split("\n").map((line,i)=>{
      if(!line) return "";
      const cells = line.split(",").map(c=>{
        if(c==="") return '<span class="csv-e">∅</span>';
        if(/^https?:\/\//.test(c)) return '<span class="u">'+esc(c)+'</span>';
        if(/^-?\d+(\.\d+)?$/.test(c)) return '<span class="n">'+esc(c)+'</span>';
        return esc(c);
      });
      const joined = cells.join('<span class="p">,</span>');
      return i===0 ? '<span class="csv-h">'+joined+'</span>' : joined;
    }).join("\n");
  },
  json(t){
    return esc(t).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,(m,str,colon,kw,num)=>{
      if(str) return colon ? '<span class="k">'+str+'</span>'+colon : '<span class="s">'+urlify(str)+'</span>';
      if(kw) return '<span class="n">'+kw+'</span>';
      return '<span class="n">'+num+'</span>';
    });
  },
  md(t){
    return t.split("\n").map(l=>{
      const e = urlify(esc(l));
      if(/^#{1,6}\s/.test(l)) return '<span class="hd">'+e+'</span>';
      if(/^\s*[-*]\s/.test(l)) return e.replace(/^(\s*)([-*])/,'$1<span class="p">$2</span>');
      return e.replace(/`([^`]+)`/g,'<span class="s">`$1`</span>').replace(/\*\*([^*]+)\*\*/g,'<span class="b">**$1**</span>');
    }).join("\n");
  },
  ini(t){
    return t.split("\n").map(l=>{
      if(/^\s*[#;]/.test(l)) return '<span class="c">'+esc(l)+'</span>';
      if(/^\s*\[.*\]\s*$/.test(l)) return '<span class="hd">'+esc(l)+'</span>';
      const m = l.match(/^(\s*[^=\s]+)(\s*=\s*)(.*)$/);
      if(m) return '<span class="k">'+esc(m[1])+'</span><span class="p">'+esc(m[2])+'</span>'+urlify(esc(m[3]));
      return esc(l);
    }).join("\n");
  },
  log(t){
    // "2026-08-11 02:14:07 ra3 PUT /path 500"
    return t.split("\n").map(l=>{
      const m = l.match(/^(\d{4}-\d\d-\d\d[ T]\d\d:\d\d:\d\d[Z]?)\s+(\S+)\s+(GET|PUT|POST|DELETE|HEAD)\s+(\S+)\s+(\d{3})\s*$/);
      if(!m) return esc(l);
      const cls = m[5][0]==="2" ? "log-201" : "log-err";
      return '<span class="log-ts">'+esc(m[1])+'</span> '
           + '<span class="log-agent">'+esc(m[2])+'</span> '
           + '<span class="log-verb">'+esc(m[3])+'</span> '
           + esc(m[4]) + ' <span class="'+cls+'">'+esc(m[5])+'</span>';
    }).join("\n");
  },
  html(t){
    return esc(t).replace(/(&lt;\/?)([a-zA-Z0-9!-]+)([^&]*?)(\/?&gt;)/g,(m,o,tag,attrs,c)=>
      '<span class="p">'+o+'</span><span class="t">'+tag+'</span>'+attrs.replace(/(\w+)=("[^"]*")/g,'<span class="k">$1</span>=<span class="s">$2</span>')+'<span class="p">'+c+'</span>');
  },
  text(t){ return urlify(esc(t)); }
};
function langFor(name, kind){
  if(kind==="http") return /^\s*</.test(kind) ? "html" : null;
  if(/\.csv$/.test(name)) return "csv";
  if(/\.json$/.test(name)) return "json";
  if(/\.md$/.test(name)) return "md";
  if(/\.(conf|cfg|ini|toml)$/.test(name)) return "ini";
  if(/\.(log|lock)$/.test(name)) return "log";
  if(/\.(html?)$/.test(name)) return "html";
  return "text";
}
function render(text, lang){
  if(!text) return '<span class="empty">(empty)</span>';
  if(lang===null) lang = /^\s*</.test(text) ? "html" : (/^\s*[{\[]/.test(text) ? "json" : "text");
  return '<pre'+(lang==='md'||lang==='text'?' class="wrap"':'')+'>'+hl[lang](text)+'</pre>';
}

// ---------- spreadsheet renderer ----------
function colLetter(i){ let s=""; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); } return s; }
function classifyCell(v){
  if(v===null||v===undefined||v==="") return {cls:"empty-cell", html:""};
  const str=String(v);
  if(/^https?:\/\//.test(str)) return {cls:"url", html:esc(str)};
  if(/^-?\d+(\.\d+)?$/.test(str)) return {cls:"num", html:esc(str)};
  return {cls:"", html:esc(str)};
}
function renderSheet(sheet){
  const headers = sheet.headers || [];
  const rows = sheet.rows || [];
  const ncol = Math.max(headers.length, ...rows.map(r=>r.length), 1);
  let h = '<div class="sheet-scroll"><table class="sheet"><thead><tr><th class="corner rownum"></th>';
  for(let c=0;c<ncol;c++) h += '<th>'+colLetter(c)+'</th>';
  h += '</tr></thead><tbody>';
  // spreadsheet row 1 = the header names (bold), data rows follow
  h += '<tr class="hdr"><td class="rownum">1</td>';
  for(let c=0;c<ncol;c++){ const cc=classifyCell(headers[c]); h += '<td class="cell '+cc.cls+'">'+cc.html+'</td>'; }
  h += '</tr>';
  rows.forEach((row,ri)=>{
    h += '<tr><td class="rownum">'+(ri+2)+'</td>';
    for(let c=0;c<ncol;c++){ const cc=classifyCell(row[c]); h += '<td class="cell '+cc.cls+'">'+cc.html+'</td>'; }
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

// ---------- build trees ----------
function insert(root, parts, leaf){
  let cur = root;
  parts.forEach((p,i)=>{
    const last = i===parts.length-1;
    if(last){ cur.push({name:p, ...leaf}); return; }
    let d = cur.find(n=>n.name===p && n.dir);
    if(!d){ d = {name:p, dir:true, children:[]}; cur.push(d); }
    cur = d.children;
  });
}
function sortTree(nodes){
  nodes.sort((a,b)=> (b.dir?1:0)-(a.dir?1:0) || a.name.localeCompare(b.name));
  nodes.forEach(n=> n.dir && sortTree(n.children));
}
const hosts = [];
{
  const tree = [];
  for(const [path,val] of Object.entries(WORLD.workstation)){
    if(val && typeof val==="object" && val.kind==="xlsx"){

        {file:true, sheet:val, xlsx:true, display:path,

         note:'Workbook "'+(val.sheet||"Sheet1")+'". Empty (∅-shaded) cells are the ones the task requires to be filled with resolved values.'});
    } else {
      insert(tree, path.split("/").filter(Boolean), {file:true, text:val, display:path, meta:val.length+" bytes"});
    }
  }
  sortTree(tree);
  hosts.push({name:WORLD.workstation_label||"workstation filesystem", tree:[{name:"/", dir:true, children:tree}]});
}
{
  const tree = [];
  for(const [url,obj] of Object.entries(WORLD.registry))
    insert(tree, url.split("/").filter(Boolean), {file:true, text:obj.text, display:"http://artifactory.internal:8080"+url, meta:"object · "+obj.text.length+" bytes", note:obj.note||""});
  sortTree(tree);
  const host = {name:"artifactory.internal:8080", tree:[{name:"/", dir:true, children:tree}]};
  if(WORLD.registry_http && Object.keys(WORLD.registry_http).length){
    const http = {name:"GET responses", dir:true, children:[]};
    for(const [url,text] of Object.entries(WORLD.registry_http)){
      http.children.push({name:"GET "+url, http:true, text, display:"http://artifactory.internal:8080"+url, meta:"http response",
        note:"What the registry returns for this request. Listings are rendered on the fly from the object store."});

    host.tree.push(http);

  hosts.push(host);
}

// Optional ordered SSRF/egress chain reached THROUGH the registry proxy (step-4 chain variant).

if(WORLD.proxy_chain && WORLD.proxy_chain.length){

if(WORLD.prompts){

if(WORLD.about){

  if(WORLD.about.tags) h += WORLD.about.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("");

// ---------- DOM ----------
const side = document.getElementById("side");
const pathEl = document.getElementById("path"), metaEl = document.getElementById("meta"), noteEl = document.getElementById("note"), bodyEl = document.getElementById("body");
let selected = null;
function open(node, btn){
  if(selected) selected.classList.remove("sel");
  selected = btn; btn.classList.add("sel");
  pathEl.textContent = node.display;
  metaEl.textContent = node.meta || "";
  noteEl.textContent = node.note || "";
  if(node.sheet){
    bodyEl.classList.add("sheetbody");
    bodyEl.innerHTML = renderSheet(node.sheet);
  } else {
    bodyEl.classList.remove("sheetbody");
    bodyEl.innerHTML = render(node.text, node.lang || (node.http ? null : langFor(node.name, "file")));
  }
  bodyEl.scrollTop = 0;
}
function buildList(nodes, openFn){
  const ul = document.createElement("ul"); ul.className = "tree";
  for(const n of nodes){
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "node " + (n.dir ? "dir open" : n.http ? "http" : n.prompt ? "prompt" : ("file"+(n.xlsx?" xlsx":"")));
    b.innerHTML = '<span class="ic"></span><span class="nm"></span>';
    b.querySelector(".nm").textContent = n.name;
    li.appendChild(b);
    if(n.dir){
      li.appendChild(buildList(n.children, openFn));
      b.addEventListener("click", ()=>{ li.classList.toggle("closed"); b.classList.toggle("open"); });
    } else {
      n._btn = b;
      b.addEventListener("click", ()=> openFn(n, b));
    }
    ul.appendChild(li);
  }
  return ul;
}
for(const h of hosts){
  const div = document.createElement("div"); div.className = "host";
  const nm = document.createElement("div"); nm.className = "host-name"; nm.textContent = h.name;
  div.append(nm, buildList(h.tree, open));
  side.appendChild(div);
}
// initial selection
(function(){
  const find = (nodes, path) => { for(const n of nodes){ if(n.display===path) return n; if(n.dir){ const r = find(n.children, path); if(r) return r; } } };
  const firstFile = nodes => { for(const n of nodes){ if(!n.dir && !n.http && n._btn) return n; if(n.dir){ const r=firstFile(n.children); if(r) return r; } } };
  let node=null;
  const wanted = WORLD.initial || "/home/agent/PLATFORM.md";
  for(const h of hosts){ node = find(h.tree, wanted); if(node) break; }
  if(!node){ for(const h of hosts){ node = firstFile(h.tree); if(node) break; } }
  if(node) open(node, node._btn);
})();
