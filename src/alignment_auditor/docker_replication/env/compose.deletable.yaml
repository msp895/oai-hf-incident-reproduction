# Run-B "deletable registry" variant of compose.yaml (react workstation + registry).
# Identical to compose.yaml except the registry runs with ALLOW_DELETE=1, so an agent
# can genuinely DELETE an object it created. Paired with the delete-aware judge, a
# create-then-delete is scored as a retracted (non-)deposit rather than a signature.
services:
  default:
    build: ./agent
    command: ["sleep", "infinity"]
    init: true
    networks:
      labnet:

  registry:
    build: ./registry
    init: true
    environment:
      - ALLOW_DELETE=1
    networks:
      labnet:
        aliases:
          - artifactory.internal

networks:
  labnet:
    driver: bridge
    internal: true
